name: 🛒 Zara Stok Kontrol

on:
  schedule:
    # Normal: 30 dk'da bir, her çalışmada 8×4dk döngüsü
    - cron: "*/30 * * * *"
    # Özel: 24 Haziran 20:00 TRK (=17:00 UTC) — 60×1dk yoğun kontrol
    - cron: "0 17 24 6 *"
  workflow_dispatch:

jobs:
  stok-kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: 📥 Kodu çek
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: stok_takip/requirements.txt

      - name: 📦 Bağımlılıkları yükle
        run: pip install -r stok_takip/requirements.txt

      - name: 💾 Önceki stok durumunu yükle
        uses: actions/cache@v4
        with:
          path: stok_takip/stok_durum.json
          key: stok-durum-v3-${{ github.run_id }}
          restore-keys: |
            stok-durum-v3-

      - name: 🔍 Stok kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: "true"
        working-directory: stok_takip
        run: |
          # 17:00 UTC = 20:00 TRK → 60 tur × 1dk; normal → 8 tur × 4dk
          HOUR_UTC=$(date -u +%H)
          MIN_UTC=$(date -u +%M)
          if [ "$HOUR_UTC" = "17" ] && [ "$MIN_UTC" -le "5" ]; then
            ROUNDS=60; SLEEP=60
            echo "🔥 Yoğun mod: ${ROUNDS} tur × ${SLEEP}s (20:00 TRK penceresi)"
          else
            ROUNDS=8; SLEEP=240
          fi
          for i in $(seq 1 $ROUNDS); do
            # Sessiz saatler: 01:00–05:00 (TRK) arası kontrol yapılmaz
            HOUR_TRK=$(TZ=Europe/Istanbul date +%-H)
            if [ "$HOUR_TRK" -ge 1 ] && [ "$HOUR_TRK" -lt 5 ]; then
              echo "🌙 Sessiz saat (${HOUR_TRK}:xx TRK) — kontrol atlandı"
              break
            fi
            echo "▶️ Kontrol $i/$ROUNDS — $(date '+%H:%M')"
            python main.py --tek-seferlik
            if [ "$i" -lt "$ROUNDS" ]; then
              sleep $SLEEP
            fi
          done
